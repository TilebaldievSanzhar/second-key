name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: secondkey
          POSTGRES_PASSWORD: secondkey
          POSTGRES_DB: secondkey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secondkey" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SK_DATABASE_URL: postgresql+asyncpg://secondkey:secondkey@localhost:5432/secondkey
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: tests
        run: uv run pytest -q
      - name: migrations match models
        run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
      - name: engine quality gate (synthetic benchmark)
        run: uv run secondkey bench --seed 11 && uv run secondkey bench --seed 23
      - name: openapi schema is committed
        run: |
          SK_ENV=test uv run secondkey openapi --out ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: api types are up to date
        run: npm run api-types && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build runtime images
        run: |
          docker buildx build --target runtime -t second-key-backend:ci backend
          docker buildx build --target runtime -t second-key-web:ci frontend
