[project]
name = "secondkey"
version = "0.1.0"
description = "Второй ключ: аудит и контроль цен закупок стройматериалов для собственника"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "redis>=5.2",
    "aioboto3>=13.2",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "typer>=0.13",
    "tzdata>=2024.2",               # расписание по Asia/Bishkek в slim-образах и на Windows
]

[project.scripts]
secondkey = "secondkey.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondkey"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # кириллица и типографика в строках и комментариях — норма продукта
    "E741",                         # «l» как имя строки в движке
    "B008",                         # FastAPI Depends в аргументах по умолчанию
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]
