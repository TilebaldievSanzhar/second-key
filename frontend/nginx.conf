# Статика SPA + обратный прокси на api. TLS снимается раньше (балансировщик/внешний прокси).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 30m;            # выгрузки 1С; лимит приложения — SK_MAX_UPLOAD_MB

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # прогресс аудита (SSE): без буферизации и с длинным таймаутом
    location ~ ^/api/audits/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    # в location нет add_header: иначе nginx отбросит заголовки безопасности уровня server
    # ассеты Vite с хэшем в имени — кэш на год
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html всегда перепроверяется: новая сборка видна сразу
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
